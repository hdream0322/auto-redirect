<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    [hidden] { display: none !important; }
    body { width: 320px; padding: 16px; }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .wordmark { font-size: 15px; }
    .state {
      margin: 14px 0 4px;
      font-size: 13px;
      color: var(--muted);
    }
    .state b { color: var(--ink); font-weight: 600; }
    .count {
      display: block;
      margin-top: 2px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
    }

    .snooze {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .snooze .lead { font-size: 12px; color: var(--muted); margin-right: auto; }
    .snooze .btn { padding: 5px 8px; font-size: 12px; }
    .snooze .btn[aria-pressed="true"] {
      background: var(--route);
      border-color: var(--route);
      color: #fff;
    }
    #snoozeState {
      display: block;
      margin-top: 8px;
      font-size: 12px;
      color: var(--route);
      font-weight: 600;
    }
    #snoozeClear { margin-top: 6px; padding: 5px 9px; font-size: 12px; }

    .quick { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
    .quick .site {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      word-break: break-all;
      margin: 0 0 8px;
    }
    .quick input, .quick select {
      width: 100%;
      font: inherit;
      font-size: 12.5px;
      padding: 7px 9px;
      margin-bottom: 7px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
    }
    .quick input { font-family: var(--mono); }
    .quick input:focus-visible, .quick select:focus-visible {
      outline: 2px solid var(--route);
      outline-offset: 0;
      border-color: transparent;
    }
    .quick .row { display: flex; gap: 6px; }
    .quick .row .btn { flex: 1; padding: 7px 10px; font-size: 12.5px; }

    #notice {
      display: block;
      margin-top: 10px;
      padding: 9px 11px;
      border-radius: 8px;
      border: 1px solid var(--danger);
      background: color-mix(in srgb, var(--danger) 10%, var(--paper));
      font-size: 12px;
      line-height: 1.5;
    }
    #msg { display: block; margin-top: 8px; font-size: 12px; color: var(--muted); }
    #msg.ok { color: var(--on); }
    #msg.err { color: var(--danger); }

    .btn.block { width: 100%; margin-top: 10px; }

    .top .tools { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--muted);
      cursor: pointer;
      flex: none;
    }
    .icon-btn:hover { background: var(--surface); color: var(--ink); }
    .icon-btn:focus-visible { outline: 2px solid var(--route); outline-offset: 2px; }
    .icon-btn svg { width: 17px; height: 17px; display: block; }
  </style>
</head>
<body>
  <div class="top">
    <span class="wordmark" id="wordmark">Auto Redirect</span>
    <div class="tools">
      <button class="icon-btn" id="openOptions" aria-label="규칙 설정 열기" title="규칙 설정">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.2.63.77 1.08 1.51 1.1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <button class="master" id="master" role="switch" aria-checked="true" aria-label="자동 리다이렉트 켜기/끄기"></button>
    </div>
  </div>

  <p class="state" id="state">불러오는 중…</p>
  <span class="count" id="count"></span>
  <span id="notice" hidden></span>

  <div class="snooze">
    <span class="lead">잠시 멈추기</span>
    <button class="btn" data-snooze="15" aria-pressed="false">15분</button>
    <button class="btn" data-snooze="60" aria-pressed="false">1시간</button>
    <button class="btn" data-snooze="today" aria-pressed="false">오늘</button>
  </div>
  <span id="snoozeState" hidden></span>
  <button class="btn ghost" id="snoozeClear" hidden>지금 해제</button>

  <div class="quick">
    <button class="btn block" id="quickToggle" style="margin-top:0">현재 페이지로 규칙 만들기</button>
    <div id="quickForm" hidden style="margin-top:10px">
      <p class="site" id="quickSite"></p>
      <input type="text" id="quickFrom" placeholder="naver.com" aria-label="원본 주소" />
      <input type="text" id="quickTo" placeholder="https://daum.net" aria-label="대상 주소" />
      <select id="quickMode" aria-label="매칭 방식">
        <option value="site">도메인 전체</option>
        <option value="exact">정확히 일치</option>
        <option value="prefix">접두사 일치</option>
        <option value="replace">부분 치환</option>
      </select>
      <div class="row">
        <button class="btn primary" id="quickSave">규칙 저장</button>
        <button class="btn ghost" id="quickCancel">취소</button>
      </div>
    </div>
  </div>

  <span id="msg"></span>

  <script type="module" src="popup.js"></script>
</body>
</html>
